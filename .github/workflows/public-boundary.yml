name: Public boundary

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:public-boundary
      - run: npm test
      - run: npm run check
      - run: npm run check:research-api
      - run: npm run build
      - run: npm run build:research-api
